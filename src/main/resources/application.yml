spring:
  application:
    name: adzuna-gateway

server:
  port: ${SERVER_PORT:8101}

adzuna:
  base-url: ${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api}
  app-id: ${ADZUNA_APP_ID}
  app-key: ${ADZUNA_APP_KEY}
  country: ${ADZUNA_COUNTRY:gb}
  results-per-page: ${ADZUNA_RESULTS_PER_PAGE:50}
  pages-per-search: ${ADZUNA_PAGES_PER_SEARCH:1}
  enabled: ${ADZUNA_ENABLED:true}

external-provider:
  mode: ${EXTERNAL_PROVIDER_MODE:LIVE}

fixture:
  dataset-id: ${FIXTURE_DATASET_ID:uk-software-developer-demo}
  dataset-version: ${FIXTURE_DATASET_VERSION:1.0.0}
  scenario: ${FIXTURE_SCENARIO:DEMO_READY}
  system-data-service-url: ${SYSTEM_DATA_SERVICE_URL:http://system-data-service:8103}
  latency:
    enabled: ${FIXTURE_LATENCY_ENABLED:false}
    job-search-ms: ${FIXTURE_JOB_SEARCH_LATENCY_MS:0}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
